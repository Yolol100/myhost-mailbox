name: Mailbox CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile
        run: python3 -m compileall -q myhost_mailbox.py tests
      - name: Test
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Public repository safety boundary
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'OUTREACH_MAIL_PASSWORD[[:space:]]*=' .
          ! grep -R --line-number -E 'ACTIONS_STEP_DEBUG:[[:space:]]*true|ACTIONS_RUNNER_DEBUG:[[:space:]]*true' .github || true
          grep -q 'OUTREACH_SMTP_SEND_ENABLED' myhost_mailbox.py
          grep -q 'confirm_send' myhost_mailbox.py
          grep -q 'UIDPLUS' myhost_mailbox.py
          grep -q 'X-Webactueel-Mailbox-Operation-ID' myhost_mailbox.py
          echo 'PUBLIC_SOURCE_SAFETY=green'

  wordpress-plugin-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.0','8.1','8.2','8.3','8.4','8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          set -euo pipefail
          find wordpress-plugin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tests/wordpress_mailbox_bridge_contract.php
          php -l tests/wordpress_mailbox_bridge_oidc_contract.php
          php -l tests/wordpress_mailbox_bridge_crypto_contract.php
      - name: Bridge contracts
        run: |
          set -euo pipefail
          php tests/wordpress_mailbox_bridge_contract.php
          php tests/wordpress_mailbox_bridge_oidc_contract.php
          php tests/wordpress_mailbox_bridge_crypto_contract.php


  package-wordpress-plugin:
    if: github.event_name == 'push'
    needs: [test, wordpress-plugin-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build deterministic WordPress plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          cp -R wordpress-plugin/webactueel-mailbox-bridge build/webactueel-mailbox-bridge
          find build/webactueel-mailbox-bridge -type f -exec touch -t 202601010000 {} +
          (
            cd build
            LC_ALL=C find webactueel-mailbox-bridge -type f -print | sort | zip -X -q ../webactueel-mailbox-bridge.zip -@
          )
          sha256sum webactueel-mailbox-bridge.zip | tee webactueel-mailbox-bridge.zip.sha256
          unzip -t webactueel-mailbox-bridge.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webactueel-mailbox-bridge-package
          path: |
            webactueel-mailbox-bridge.zip
            webactueel-mailbox-bridge.zip.sha256
          if-no-files-found: error
          retention-days: 7
